<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="基于 Web 的智能巡检机器人二维仿真控制台：查看地图、手动控制机器人移动并查看状态反馈。" />
    <title>智能巡检机器人 · 二维仿真控制台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>智能巡检机器人</h1>
          <p class="sub">二维仿真控制台 · 手动巡检</p>
        </div>
      </div>
      <p class="conn" id="conn" data-state="idle">
        <span class="conn-dot" aria-hidden="true"></span>
        <span id="conn-text">正在连接服务…</span>
      </p>
    </header>

    <main class="layout">
      <section class="panel map-panel" aria-labelledby="map-title">
        <div class="panel-head">
          <h2 id="map-title">巡检地图</h2>
          <p class="hint" id="map-meta">等待服务端返回地图…</p>
        </div>

        <div class="board-wrap">
          <div
            class="board"
            id="board"
            role="group"
            aria-label="二维巡检地图"
            aria-busy="false"
          ></div>
          <p class="placeholder" id="placeholder">正在加载地图…</p>
        </div>

        <ul class="legend" aria-label="地图图例">
          <li><span class="swatch swatch-free" aria-hidden="true"></span>可通行区域</li>
          <li><span class="swatch swatch-block" aria-hidden="true">障</span>障碍物（不可通过）</li>
          <li><span class="swatch swatch-robot" aria-hidden="true">机</span>机器人（箭头为朝向）</li>
        </ul>
      </section>

      <section class="panel side-panel" aria-labelledby="control-title">
        <div class="panel-head">
          <h2 id="control-title">手动控制</h2>
          <p class="hint">每次点击移动一格</p>
        </div>

        <dl class="facts">
          <div class="fact">
            <dt>位置</dt>
            <dd id="fact-position">—</dd>
          </div>
          <div class="fact">
            <dt>朝向</dt>
            <dd id="fact-heading">—</dd>
          </div>
          <div class="fact">
            <dt>状态</dt>
            <dd id="fact-status">—</dd>
          </div>
        </dl>

        <div class="dpad" role="group" aria-label="移动方向">
          <button class="key key-up" type="button" data-direction="up" aria-keyshortcuts="ArrowUp" disabled>
            <span class="key-glyph" aria-hidden="true">↑</span><span class="key-label">上</span>
          </button>
          <button class="key key-left" type="button" data-direction="left" aria-keyshortcuts="ArrowLeft" disabled>
            <span class="key-glyph" aria-hidden="true">←</span><span class="key-label">左</span>
          </button>
          <button class="key key-down" type="button" data-direction="down" aria-keyshortcuts="ArrowDown" disabled>
            <span class="key-glyph" aria-hidden="true">↓</span><span class="key-label">下</span>
          </button>
          <button class="key key-right" type="button" data-direction="right" aria-keyshortcuts="ArrowRight" disabled>
            <span class="key-glyph" aria-hidden="true">→</span><span class="key-label">右</span>
          </button>
        </div>

        <button class="btn-ghost" id="reload" type="button" disabled>重新读取状态</button>

        <p class="feedback" id="feedback" role="status" aria-live="polite">正在连接服务…</p>

        <p class="keys-hint">
          也可以直接用键盘 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 移动
        </p>
      </section>
    </main>

    <footer class="foot">
      <p>地图与状态全部来自后端接口，页面不做本地预测；请求失败时不会改变画面中的机器人位置。</p>
    </footer>

    <noscript>
      <p class="noscript">本页面需要 JavaScript 才能显示地图和发送移动指令，请在浏览器中启用后刷新。</p>
    </noscript>

    <script src="app.js"></script>
  </body>
</html>
