<?xml version="1.0" encoding="UTF-8"?>
<!--
  场景精灵库（scene sprites）
  ==================================================================
  这个文件里放的是「站在地面上的东西」，页面会把它内联进 DOM，
  然后按格子克隆一份，所以里面的 g 可以带 CSS 动画。

  #dog    机器狗（宇树 Go2 风格），侧视，默认朝右。
          关节用 g 嵌套模拟：hip → thigh → knee → calf → foot，
          与 assets/go2-lite.urdf 里的关节一一对应（见 assets/README.md）。
  #crate  障碍物货箱，等轴测视角，页面会在正面叠一个「障」字。

  视角与页面一致：地面上的一切都画在这个视图里，但渲染时它们会被
  「立起来」（见 styles.css 的 .billboard），所以这里画的是正视图。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="dogShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6edf2" />
      <stop offset="0.55" stop-color="#c2d0da" />
      <stop offset="1" stop-color="#9aacb8" />
    </linearGradient>
    <linearGradient id="dogHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe8ee" />
      <stop offset="1" stop-color="#a8b8c4" />
    </linearGradient>
    <linearGradient id="crateTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55697a" />
      <stop offset="1" stop-color="#3f5160" />
    </linearGradient>
  </defs>

  <!-- 机器狗：160×120，四脚落在 y≈110，朝右 -->
  <svg id="dog" viewBox="0 0 160 120" width="160" height="120">
    <g class="dog">
      <!-- 远侧两条腿，颜色更深，先画，形成前后遮挡 -->
      <g class="hip" transform="translate(76 68)">
        <g class="thigh leg-far">
          <rect x="-4" y="-1" width="9" height="21" rx="4" />
          <g class="knee" transform="translate(0 19)">
            <g class="calf leg-far">
              <rect x="-3.5" y="-1" width="7" height="17" rx="3" />
              <rect x="-6" y="14" width="12" height="5" rx="2.5" />
            </g>
          </g>
        </g>
      </g>
      <g class="hip" transform="translate(106 66)">
        <g class="thigh leg-far">
          <rect x="-4" y="-1" width="9" height="21" rx="4" />
          <g class="knee" transform="translate(0 19)">
            <g class="calf leg-far">
              <rect x="-3.5" y="-1" width="7" height="17" rx="3" />
              <rect x="-6" y="14" width="12" height="5" rx="2.5" />
            </g>
          </g>
        </g>
      </g>

      <!-- 尾巴 -->
      <path class="tail" d="M46 52 q-13 -7 -17 3" fill="none" stroke-width="4.5" />
      <circle class="tail-tip" cx="29.5" cy="55.5" r="3" />

      <!-- 躯干 -->
      <circle class="shell" cx="60" cy="57" r="17" />
      <rect class="shell" x="46" y="41" width="78" height="31" rx="13" />
      <circle class="shell" cx="112" cy="55" r="15" />
      <rect class="belly" x="52" y="66" width="64" height="7" rx="3.5" />
      <rect class="stripe" x="62" y="44" width="40" height="4" rx="2" />

      <!-- 脖子 + 头 -->
      <rect class="joint" x="120" y="50" width="9" height="14" rx="4" />
      <g class="head">
        <rect class="shell-head" x="124" y="33" width="33" height="27" rx="9" />
        <rect class="visor" x="128" y="38" width="21" height="9" rx="4.5" />
        <circle class="eye" cx="144" cy="42.5" r="2.1" />
        <circle class="eye eye--dim" cx="134" cy="42.5" r="1.7" />
        <ellipse class="lidar-base" cx="140" cy="32" rx="10" ry="3.4" />
        <ellipse class="lidar" cx="140" cy="30" rx="7" ry="2.6" />
        <rect class="muzzle" x="150" y="44" width="6" height="9" rx="3" />
        <path class="antenna" d="M132 30 q-1 -6 3 -8" fill="none" stroke-width="1.6" />
        <circle class="antenna-tip" cx="135.5" cy="21.5" r="1.9" />
      </g>

      <!-- 近侧两条腿 -->
      <g class="hip" transform="translate(64 70)">
        <g class="thigh leg-near">
          <rect x="-4.5" y="-1" width="10" height="22" rx="4.5" />
          <g class="knee" transform="translate(0 20)">
            <g class="calf leg-near">
              <rect x="-4" y="-1" width="8" height="17" rx="3.5" />
              <rect x="-7" y="14" width="14" height="5.5" rx="2.75" />
            </g>
          </g>
        </g>
      </g>
      <g class="hip" transform="translate(114 69)">
        <g class="thigh leg-near">
          <rect x="-4.5" y="-1" width="10" height="22" rx="4.5" />
          <g class="knee" transform="translate(0 20)">
            <g class="calf leg-near">
              <rect x="-4" y="-1" width="8" height="17" rx="3.5" />
              <rect x="-7" y="14" width="14" height="5.5" rx="2.75" />
            </g>
          </g>
        </g>
      </g>
    </g>
  </svg>

  <!-- 禁止通行牌：120×150，板面正对观众，两条支腿插在地上 -->
  <svg id="sign" viewBox="0 0 120 150" width="120" height="150">
    <g class="sign">
      <rect class="sign-leg" x="31" y="84" width="8" height="58" rx="4" />
      <rect class="sign-leg" x="81" y="84" width="8" height="58" rx="4" />
      <rect class="sign-foot" x="21" y="136" width="28" height="8" rx="4" />
      <rect class="sign-foot" x="71" y="136" width="28" height="8" rx="4" />
      <rect class="sign-board" x="8" y="14" width="104" height="74" rx="10" />
      <rect class="sign-inner" x="16" y="22" width="88" height="58" rx="6" />
      <text class="sign-text" x="60" y="71">禁</text>
    </g>
  </svg>

  <!-- 障碍货箱（备用皮）：90×90，等轴测，顶面 + 左右两个立面 -->
  <svg id="crate" viewBox="0 0 90 90" width="90" height="90">
    <g class="crate">
      <polygon class="crate-left" points="11,52 45,70 45,90 11,72" />
      <polygon class="crate-right" points="45,70 79,52 79,72 45,90" />
      <polygon class="crate-top" points="45,34 79,52 45,70 11,52" />
      <polyline class="crate-edge" points="11,52 45,34 79,52" fill="none" />
      <line class="crate-edge" x1="45" y1="70" x2="45" y2="90" />
      <line class="crate-edge" x1="11" y1="52" x2="11" y2="72" />
      <line class="crate-edge" x1="79" y1="52" x2="79" y2="72" />
      <polyline class="crate-band" points="30,41 64,59" fill="none" />
      <polyline class="crate-band" points="22,57 22,77" fill="none" />
      <polyline class="crate-band" points="68,57 68,77" fill="none" />
    </g>
  </svg>
</svg>
