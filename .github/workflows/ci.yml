name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 代码风格检查
        run: ruff check .

      - name: 语法编译检查
        run: python -m compileall -q app

      - name: 运行测试
        run: pytest -q
