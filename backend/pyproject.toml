[project]
name = "patrol-sim-backend"
version = "0.1.0"
description = "Web 智能巡检机器人 · 后端骨架"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
